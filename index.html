<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewpay | تسجيل الحضور</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#071426,#12345a);
      color: white; font-family: Arial,sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; padding: 30px;
      border: 1px solid #29466b; border-radius: 20px;
      background: #10213a; box-shadow: 0 15px 45px #0005;
    }
    .logo {
      text-align: center; font-size: 32px;
      font-weight: bold; color: #66c5ff;
    }
    .subtitle {
      text-align: center; color: #bdcbe0;
      line-height: 1.8; margin: 15px 0 28px;
    }
    label { display: block; margin: 17px 0 8px; }
    input {
      width: 100%; padding: 14px; border-radius: 10px;
      border: 1px solid #365273; background: #09182b;
      color: white; font-size: 16px; outline: none;
    }
    input:focus { border-color: #54b9ff; }
    button {
      width: 100%; margin-top: 23px; padding: 14px;
      border: 0; border-radius: 10px; background: #1689e8;
      color: white; font-size: 16px; font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message {
      display: none; margin-top: 18px; padding: 13px;
      border-radius: 9px; line-height: 1.7;
    }
    .footer {
      text-align: center; color: #9eb2cb;
      font-size: 12px; line-height: 1.8; margin-top: 20px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">VIEWPAY</div>
    <p class="subtitle">
      أهلاً بيك في Viewpay<br>
      سجّل حضورك برقم الهاتف والكود الوظيفي.
    </p>

    <form id="attendanceForm">
      <label for="phone">رقم الهاتف</label>
      <input id="phone" type="tel" inputmode="tel"
        autocomplete="tel" placeholder="اكتب رقم الهاتف"
        maxlength="20" required>

      <label for="code">الكود الوظيفي</label>
      <input id="code" type="password" autocomplete="off"
        placeholder="اكتب الكود الوظيفي" maxlength="100" required>

      <button id="submitButton" type="submit">
        تسجيل الحضور
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <div class="footer">نظام تسجيل الحضور الخاص بـ Viewpay</div>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL =
      'https://mfzygmdxlioigodrqlca.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_6nKHRh9bp5WHG77nCvAmgA_S6cg1jLo';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('attendanceForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitButton');

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.display = 'block';
      message.style.background = success ? '#123c32' : '#47262c';
      message.style.color = success ? '#a7f3d0' : '#fecaca';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const phone = document.getElementById('phone').value.trim();
      const code = document.getElementById('code').value.trim();

      if (!phone || !code) {
        showMessage('اكتب رقم الهاتف والكود الوظيفي.');
        return;
      }

      button.disabled = true;
      button.textContent = 'جاري التحقق...';
      message.style.display = 'none';

      try {
        const { data, error } = await supabase.rpc(
          'record_attendance',
          { p_phone: phone, p_code: code }
        );

        if (error) {
          console.error('Attendance error:', error.message);
          showMessage(
            'تعذر تسجيل الحضور. راجع البيانات أو تواصل مع المسؤول.'
          );
          return;
        }

        if (data && typeof data === 'object' &&
            data.success === false) {
          showMessage(data.message || 'لم يتم تسجيل الحضور.');
          return;
        }

        showMessage(
          'تم استلام الطلب. تأكد من تسجيل الحضور في النظام.',
          true
        );
        form.reset();

      } catch (error) {
        console.error('Connection error:', error);
        showMessage('تعذر الاتصال. تحقق من الإنترنت وحاول مرة أخرى.');
      } finally {
        button.disabled = false;
        button.textContent = 'تسجيل الحضور';
      }
    });
  </script>
</body>
</html>
